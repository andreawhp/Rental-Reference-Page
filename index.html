<!--
PREFILL LINK GUIDE

Use these field names in URL:
landlordName
email (use %40 instead of @)
tenantName
previousAddress
moveInDate (YYYY-MM-DD)
moveOutDate (YYYY-MM-DD)
moveOutTerms
rentAmount
rentalAgreement
occupants
latePayments (Yes/No)
nsfChecks (Yes/No)
leaseViolations (Yes/No)
eviction (Yes/No)
pets (Yes/No)
relationshipConnection (Yes/No)
goodCondition (Yes/No)
rentAgain (Yes/No)

Formatting:
Space = %20
@ = %40

Example:
?tenantName=John%20Doe&email=test%40email.com
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rental Reference Request</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f4ef;
      --card: #fdfbf8;
      --card-strong: #ffffff;
      --text: #1e1b18;
      --muted: #6f685f;
      --line: rgba(30, 27, 24, 0.16);
      --accent: #1e1b18;
      --accent-soft: #efe9e1;
      --shadow: 0 10px 24px rgba(30, 27, 24, 0.06);
      --radius: 10px;
      --input-radius: 6px;
      --max: 1480px;
    }

    * { box-sizing: border-box; }

    body {
      font-size: 21px;
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    h1, h2, h3 {
      font-family: Georgia, serif;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .sitebar {
      background: #fbfaf7;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .sitebar-inner {
      max-width: var(--max);
      margin: 0 auto;
      padding: 14px 40px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .site-logo {
      height: 64px;
      width: auto;
      display: block;
    }

    .sitebar-title {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 2rem;
      line-height: 1;
      color: var(--text);
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 40px 72px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: 54px;
      align-items: start;
      margin-bottom: 34px;
    }

    .hero-copy h1 {
      margin: 0 0 10px;
      font-size: clamp(2.2rem, 4vw, 3.4rem);
      line-height: 1;
    }

    .hero-kicker {
      margin: 0 0 20px;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-weight: 500;
    }

    .hero-copy p {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
      max-width: 880px;
    }

    .hero-actions {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .hero-actions button,
    .ghost-button {
      display: block;
      width: 100%;
      text-align: center;
      padding: 16px 18px;
      border-radius: 4px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: white;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 12px;
    }

    .ghost-button {
      background: transparent;
      color: var(--text);
    }

    .app-shell {
      display: block;
      max-width: 760px;
      margin-left: 0;
    }

    .main-column {
      width: 100%;
      max-width: 760px;
      margin: 0;
    }

    .card {
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      padding: 0 0 44px;
      margin-bottom: 48px;
      border-bottom: 1px solid var(--line);
    }

    .section-head {
      display: block;
      margin-bottom: 18px;
    }

    .section-head h2 {
      margin: 0 0 10px;
      font-size: 1.9rem;
      font-family: 'Roboto', sans-serif;
      font-weight: 500;
      letter-spacing: 0;
    }

    .section-label {
      display: block;
      font-weight: 500;
      margin-bottom: 10px;
      margin-top: 6px;
      font-size: 1rem;
      color: var(--text);
      line-height: 1.4;
    }

    input, textarea, select {
      width: 100%;
      padding: 16px 18px;
      border-radius: var(--input-radius);
      border: 1px solid var(--line);
      font-family: 'Roboto', sans-serif;
      font-size: 1.125rem;
      background: #fbfaf8;
      color: var(--text);
      outline: none;
      margin-bottom: 0;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    input:focus, textarea:focus, select:focus {
      border-color: rgba(30, 27, 24, 0.34);
      box-shadow: 0 0 0 3px rgba(30, 27, 24, 0.06);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .inline-options {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .inline-options label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 0;
      font-weight: 400;
      font-size: 1.125rem;
    }

    .inline-options input[type="radio"] {
      width: auto;
      margin: 0;
      accent-color: #1e1b18;
    }

    .conditional {
      margin-top: 12px;
      display: none;
      padding: 14px;
      border-radius: 6px;
      background: rgba(30, 27, 24, 0.03);
      border: 1px solid rgba(30, 27, 24, 0.08);
    }

    .conditional.show {
      display: block;
    }

    .sidebar-card {
      position: sticky;
      top: 96px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 0;
      box-shadow: none;
      padding: 30px;
    }

    .sidebar-card h3 {
      position: sticky;
      top: 96px;
      margin: 0 0 16px;
      font-size: 2rem;
      font-family: 'Roboto', sans-serif;
      font-weight: 500;
      background: var(--card);
      padding-bottom: 10px;
      z-index: 2;
    }

    .sidebar-list {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .sidebar-list li {
      padding: 0;
      background: transparent;
      font-size: 1.125rem;
      line-height: 1.75;
      color: var(--muted);
    }

    .contact-box {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      font-size: 1.125rem;
      line-height: 1.8;
      color: var(--muted);
    }

    .contact-phone {
      display: inline-block;
      margin: 10px 0 16px;
      font-size: 1.35rem;
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    button.submit-button {
      margin-top: 16px;
      padding: 18px 18px;
      width: 100%;
      border: 1px solid var(--accent);
      border-radius: 4px;
      background: var(--accent);
      color: white;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      box-shadow: none;
    }

    .message {
      margin-top: 12px;
      color: #166534;
      font-weight: 500;
      font-size: 0.95rem;
    }

    .footer-note {
      margin: 0;
      line-height: 1.8;
      color: var(--muted);
      font-size: 1.125rem;
    }

    @media (max-width: 1180px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .main-column {
        max-width: none;
      }

      .sidebar-card,
      .sidebar-card h3 {
        position: static;
      }
    }

      .sidebar-card {
        position: static;
      }
    }

    @media (max-width: 900px) {
      .sitebar-inner,
      .wrap {
        padding-left: 20px;
        padding-right: 20px;
      }

      .site-nav {
        gap: 18px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
    }

    @media (max-width: 760px) {
      .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 80px 48px;
    }

    .form-grid > div {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-top: 32px;
    }

    .form-grid > div:first-child {
      margin-top: 0;
    }
      .sitebar-inner { flex-direction: column; align-items: flex-start; }
      body { font-size: 18px; }
    }
  

    #form .form-grid {
      row-gap: 0 !important;
    }

    #form .form-grid > div {
      margin-bottom: 36px !important;
    }

    #form .form-grid > div.full {
      margin-bottom: 36px !important;
    }

    #form .form-grid label {
      margin-bottom: 14px !important;
      display: block;
    }
  </style>
</head>
<body>
  <header class="sitebar">
    <div class="sitebar-inner">
      <img src="logo1.png" alt=" logo" class="site-logo">
      <h1 class="sitebar-title">Rental Reference Request</h1>
    </div>
  </header>

  <div class="wrap">
    </div>
        <div class="badge"></div>
      </div>
    </div>

    <div class="app-shell">
      <div class="main-column">
        <form id="form">
      <div class="card">
        
        <div class="form-grid">
          <div>
            <label for="landlordName">Name</label>
            <input id="landlordName" name="landlordName">
          </div>
          <div>
            <label for="email">Email address</label>
            <input id="email" name="email" type="email">
          </div>
        </div>
      </div>

      <div class="card">
        
        <div class="form-grid">
          <div>
            <label for="tenantName">Tenant name</label>
            <input id="tenantName" name="tenantName">
          </div>
          <div>
            <label for="previousAddress">Previous rental address</label>
            <input id="previousAddress" name="previousAddress">
          </div>

          <div>
            <label for="moveInDate">Move-in date</label>
            <input id="moveInDate" name="moveInDate" type="date">
          </div>
          <div>
            <label for="moveOutDate">Move-out date</label>
            <input id="moveOutDate" name="moveOutDate" type="date">
          </div>

          <div>
            <label>Proper move-out notice given?</label>
            <div class="inline-options">
              <label><input type="radio" name="properNotice" value="Yes"> Yes</label>
              <label><input type="radio" name="properNotice" value="No"> No</label>
            </div>
          </div>
          <div>
            <label for="moveOutTerms">Move-out terms</label>
            <input id="moveOutTerms" name="moveOutTerms" placeholder="Example: 30-day notice, mutual agreement, lease end">
          </div>

          <div>
            <label for="rentAmount">Rent amount</label>
            <input id="rentAmount" name="rentAmount" placeholder="$1,850">
          </div>
          <div>
            <label for="rentalAgreement">Rental agreement</label>
            <select id="rentalAgreement" name="rentalAgreement">
              <option value="">Select one</option>
              <option value="Lease">Lease</option>
              <option value="Month-to-month">Month-to-month</option>
            </select>
          </div>

          <div class="full">
            <label>Late payments?</label>
            <div class="inline-options">
              <label><input type="radio" name="latePayments" value="Yes"> Yes</label>
              <label><input type="radio" name="latePayments" value="No"> No</label>
            </div>
            <div class="conditional" data-show-when="latePayments:Yes">
              <label for="latePaymentsCount">How many?</label>
              <input id="latePaymentsCount" name="latePaymentsCount">
            </div>
          </div>

          <div class="full">
            <label>NSF checks?</label>
            <div class="inline-options">
              <label><input type="radio" name="nsfChecks" value="Yes"> Yes</label>
              <label><input type="radio" name="nsfChecks" value="No"> No</label>
            </div>
            <div class="conditional" data-show-when="nsfChecks:Yes">
              <label for="nsfChecksCount">How many?</label>
              <input id="nsfChecksCount" name="nsfChecksCount">
            </div>
          </div>

          <div class="full">
            <label>Lease violations?</label>
            <div class="inline-options">
              <label><input type="radio" name="leaseViolations" value="Yes"> Yes</label>
              <label><input type="radio" name="leaseViolations" value="No"> No</label>
            </div>
            <div class="conditional" data-show-when="leaseViolations:Yes">
              <label for="leaseViolationsDetails">Please provide details</label>
              <textarea id="leaseViolationsDetails" name="leaseViolationsDetails"></textarea>
            </div>
          </div>

          <div class="full">
            <label>Eviction?</label>
            <div class="inline-options">
              <label><input type="radio" name="eviction" value="Yes"> Yes</label>
              <label><input type="radio" name="eviction" value="No"> No</label>
            </div>
            <div class="conditional" data-show-when="eviction:Yes">
              <label for="evictionWhy">Why?</label>
              <textarea id="evictionWhy" name="evictionWhy"></textarea>
            </div>
          </div>

          <div>
            <label for="occupants">Number of occupants</label>
            <input id="occupants" name="occupants" type="number" min="0" step="1">
          </div>
          <div class="full">
            <label>Pets?</label>
            <div class="inline-options">
              <label><input type="radio" name="pets" value="Yes"> Yes</label>
              <label><input type="radio" name="pets" value="No"> No</label>
            </div>
            <div class="conditional" data-show-when="pets:Yes">
              <label for="petsHowMany">How many?</label>
              <input id="petsHowMany" name="petsHowMany">
            </div>
          </div>

          <div class="full">
            <label>Are you a friend, coworker, or related to the previous tenant?</label>
            <div class="inline-options">
              <label><input type="radio" name="relationshipConnection" value="Yes"> Yes</label>
              <label><input type="radio" name="relationshipConnection" value="No"> No</label>
            </div>
            <div class="conditional" data-show-when="relationshipConnection:Yes">
              <label for="relationshipDetails">How are you related?</label>
              <textarea id="relationshipDetails" name="relationshipDetails"></textarea>
            </div>
          </div>

          <div class="full">
            <label>Was the property left in good condition?</label>
            <div class="inline-options">
              <label><input type="radio" name="goodCondition" value="Yes"> Yes</label>
              <label><input type="radio" name="goodCondition" value="No"> No</label>
            </div>
            <div class="conditional" data-show-when="goodCondition:No">
              <label for="goodConditionDetails">Please provide details</label>
              <textarea id="goodConditionDetails" name="goodConditionDetails"></textarea>
            </div>
          </div>

          <div class="full">
            <label>Would you rent to this tenant again?</label>
            <div class="inline-options">
              <label><input type="radio" name="rentAgain" value="Yes"> Yes</label>
              <label><input type="radio" name="rentAgain" value="No"> No</label>
            </div>
          </div>

          <div class="full">
            <label for="otherComments">Other comments</label>
            <textarea id="otherComments" name="otherComments"></textarea>
          </div>
        </div>
      </div>

      <div class="card">
        
        <div class="form-grid">
          <div>
            <label for="completedBy">Completed by</label>
            <input id="completedBy" name="completedBy">
          </div>
          <div>
            <label for="date">Date completed</label>
            <input id="date" name="date" type="date">
          </div>
        </div>
      </div>

            <div class="card">
        <p class="footer-note">
          Thank you for your time. If you have any questions or additional comments, please call us at 509-525-1040 or email our office at office@welcomehps.com.
        </p>

        <button type="submit" class="submit-button">SUBMIT REFERENCE</button>
        <div class="message" id="msg"></div>
      </div>
        </form>
      </div>

      
    </div>
  </div>

  <script>
    const form = document.getElementById('form');
    const msg = document.getElementById('msg');

    function prefill() {
      const params = new URLSearchParams(window.location.search);
      params.forEach((val, key) => {
        const field = form.elements[key];
        if (!field) return;
        if (field instanceof RadioNodeList) {
          const target = form.querySelector(`input[name="${key}"][value="${val}"]`);
          if (target) target.checked = true;
        } else {
          field.value = val;
        }
      });
      updateConditionalFields();
    }

    function updateConditionalFields() {
      document.querySelectorAll('.conditional').forEach(section => {
        const [fieldName, expectedValue] = section.dataset.showWhen.split(':');
        const selected = form.querySelector(`input[name="${fieldName}"]:checked`);
        const show = selected && selected.value === expectedValue;
        section.classList.toggle('show', show);
      });
    }

    form.addEventListener('change', updateConditionalFields);
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      msg.textContent = 'Reference captured. Submission delivery can be connected next.';
    });

    prefill();
  </script>
</body>
</html>
