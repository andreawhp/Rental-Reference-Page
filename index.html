<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rental Reference Request</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f5f6fa; margin:0; }
    .wrap { max-width:900px; margin:30px auto; }
    .card { background:white; padding:20px; border-radius:10px; margin-bottom:20px; }
    h2 { margin-top:0; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
    .full { grid-column:1/-1; }
    label { display:block; margin-bottom:5px; font-weight:bold; }
    input, textarea { width:100%; padding:10px; border-radius:6px; border:1px solid #ccc; }
    textarea { min-height:100px; }
    .inline { display:flex; gap:15px; margin-top:5px; }
    button { width:100%; padding:15px; background:#2563eb; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer; }
    .message { margin-top:10px; color:green; }
  </style>
</head>
<body>
<div class="wrap">

<form id="form">

<div class="card">
<h2>Requesting Tenant / Property</h2>
<div class="form-grid">
<div><label>Tenant full name</label><input name="tenantName"></div>
<div><label>Tenant email</label><input name="tenantEmail"></div>
<div><label>Property applying for</label><input name="propertyAddress"></div>
<div><label>Requested move-in date</label><input name="moveInDate"></div>
</div>
</div>

<div class="card">
<h2>Previous Landlord / Property Manager</h2>
<div class="form-grid">
<div><label>Landlord name</label><input name="landlordName"></div>
<div><label>Company</label><input name="companyName"></div>
<div><label>Phone</label><input name="phone"></div>
<div><label>Email</label><input name="email"></div>
<div class="full"><label>Address rented</label><input name="previousAddress"></div>
</div>
</div>

<div class="card">
<h2>Tenancy Details</h2>
<div class="form-grid">
<div><label>Lease start</label><input name="leaseStart"></div>
<div><label>Lease end</label><input name="leaseEnd"></div>
<div><label>Monthly rent</label><input name="rent"></div>
<div><label>Occupants</label><input name="occupants"></div>
<div class="full">
<label>Was rent paid on time?</label>
<div class="inline">
<label><input type="radio" name="paid" value="Yes"> Yes</label>
<label><input type="radio" name="paid" value="Usually"> Usually</label>
<label><input type="radio" name="paid" value="No"> No</label>
</div>
</div>
<div class="full">
<label>Would you rent again?</label>
<div class="inline">
<label><input type="radio" name="again" value="Yes"> Yes</label>
<label><input type="radio" name="again" value="Maybe"> Maybe</label>
<label><input type="radio" name="again" value="No"> No</label>
</div>
</div>
</div>
</div>

<div class="card">
<h2>Property Condition / Notes</h2>
<div class="form-grid">
<div class="full">
<label>Comments</label>
<textarea name="comments"></textarea>
</div>
<div><label>Completed by</label><input name="completedBy"></div>
<div><label>Date</label><input name="date"></div>
</div>
</div>

<button type="submit">Submit Reference</button>
<div class="message" id="msg"></div>

</form>
</div>

<script>
const form = document.getElementById('form');
const msg = document.getElementById('msg');

function prefill(){
 const params = new URLSearchParams(window.location.search);
 params.forEach((val,key)=>{
  if(form.elements[key]) form.elements[key].value = val;
 });
}

form.addEventListener('submit', e=>{
 e.preventDefault();
 msg.textContent = 'Submitted (backend coming later)';
});

prefill();
</script>

</body>
</html>
