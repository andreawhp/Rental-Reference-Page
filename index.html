<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rental Reference Request</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #dbe2ea;
      --accent: #2563eb;
      --accent-soft: #e8f0ff;
      --success: #166534;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 180px);
      color: var(--text);
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 18px 64px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
      margin-bottom: 18px;
    }

    h1 { margin: 0 0 10px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .full { grid-column: 1 / -1; }

    label { display: block; margin-bottom: 6px; font-weight: 600; }

    input, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
    }

    textarea { min-height: 100px; }

    button {
      margin-top: 20px;
      padding: 14px;
      width: 100%;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .message {
      margin-top: 12px;
      color: var(--success);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="card">
      <h1>Rental Reference Request</h1>
      <p>Please review and complete the information below.</p>
    </div>

    <form id="form">

      <div class="card">
        <h3>Tenant Information</h3>
        <div class="form-grid">
          <div>
            <label>Tenant Name</label>
            <input name="tenantName" />
          </div>
          <div>
            <label>Property Applying For</label>
            <input name="property" />
          </div>
        </div>
      </div>

      <div class="card">
        <h3>Previous Landlord</h3>
        <div class="form-grid">
          <div>
            <label>Landlord Name</label>
            <input name="landlordName" />
          </div>
          <div>
            <label>Email</label>
            <input name="landlordEmail" />
          </div>
        </div>
      </div>

      <div class="card">
        <h3>Reference Details</h3>
        <div class="form-grid">
          <div>
            <label>Monthly Rent</label>
            <input name="rent" />
          </div>
          <div>
            <label>Was rent paid on time?</label>
            <input name="paid" />
          </div>
          <div class="full">
            <label>Comments</label>
            <textarea name="comments"></textarea>
          </div>
        </div>
      </div>

      <button type="submit">Submit Reference</button>
      <div class="message" id="message"></div>

    </form>

  </div>

  <script>
    const form = document.getElementById('form');
    const message = document.getElementById('message');

    function prefillFromURL() {
      const params = new URLSearchParams(window.location.search);
      params.forEach((value, key) => {
        if (form.elements[key]) {
          form.elements[key].value = value;
        }
      });
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      message.textContent = "Form submitted (backend will be connected later).";
    });

    prefillFromURL();
  </script>

</body>
</html>
